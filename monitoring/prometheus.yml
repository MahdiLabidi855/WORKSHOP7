# prometheus.yml
global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'spring-boot'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['backend:8080']
        labels:
          application: 'user-management-backend'
  
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']
